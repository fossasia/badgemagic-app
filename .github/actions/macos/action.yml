name: "macOS Workflow"

inputs:
  VERSION_NAME:
    description: 'Version Name to be used for build'
    required: false
    default: '1.0.0'
  VERSION_CODE:
    description: 'Version Code to be used for build'
    required: true
    default: '1'

runs:
  using: "composite"
  steps:
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        cache: true
        flutter-version-file: pubspec.yaml

    - name: Install Dart/Flutter dependencies
      shell: bash
      run: flutter pub get

    # hid_tool 0.1.4+ ships a relative SwiftPM path to third_party/hidapi that
    # breaks under Flutter's ephemeral Packages/ symlink layout (#1994).
    - name: Patch hid_tool macOS SwiftPM hidapi path
      shell: bash
      run: bash tool/patch_hid_tool_macos_spm.sh

    - name: Build macOS App
      shell: bash
      env:
        VERSION_NAME: ${{ inputs.VERSION_NAME }}
        VERSION_CODE: ${{ inputs.VERSION_CODE }}
      run: |
        flutter build macos --build-name $VERSION_NAME --build-number $VERSION_CODE
