name: Build and publish Flutter apps (Android, iOS, macOS, Windows, Debian)

on:
  push:
    branches:
      - flutter_main  # Changed from flutter_main to main
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.22.2"
  JAVA_VERSION: "17"
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

permissions:
  contents: write

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk

  ios-ipa:
    name: iOS IPA (no codesign)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode version
        run: |
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS (no-codesign)
        run: flutter build ipa --no-codesign

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa

  macos-app:
    name: macOS .app (zipped)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable macOS desktop
        run: |
          flutter config --enable-macos-desktop

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Zip .app bundle
        run: |
          APP_PATH="build/macos/Build/Products/Release/*.app"
          ditto -c -k --sequesterRsrc --keepParent $APP_PATH macos-app.zip

      - name: Upload macOS app zip
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: macos-app.zip

  windows-exe:
    name: Windows .exe (zipped)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Windows desktop
        shell: bash
        run: flutter config --enable-windows-desktop

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Flutter pub get
        shell: bash
        run: flutter pub get

      - name: Build Windows app
        shell: bash
        run: flutter build windows --release

      - name: Package .exe (zip)
        shell: bash
        run: |
          cd build/windows/runner/Release
          7z a ../../../../windows-app.zip *

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: windows-app.zip

  debian-deb:
    name: Debian .deb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux app
        run: flutter build linux --release

      - name: Create .deb package
        run: |
          APP_NAME=$(basename "${GITHUB_REPOSITORY}")
          VERSION=${GITHUB_SHA::7}
          WORKDIR=$(pwd)
          STAGE_DIR="${WORKDIR}/debian_pkg/${APP_NAME}_${VERSION}"
          BIN_DIR="${STAGE_DIR}/usr/local/bin/${APP_NAME}"
          DESKTOP_DIR="${STAGE_DIR}/usr/share/applications"
          CONTROL_DIR="${STAGE_DIR}/DEBIAN"
          mkdir -p "$BIN_DIR" "$DESKTOP_DIR" "$CONTROL_DIR"
          cp -r build/linux/x64/release/bundle/* "$BIN_DIR"/
          cat > "$CONTROL_DIR/control" << EOF
          Package: ${APP_NAME}
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: GitHub Actions <actions@github.com>
          Description: ${APP_NAME} built from Flutter
          EOF
          dpkg-deb --build "${STAGE_DIR}" "${APP_NAME}_${VERSION}_amd64.deb"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: debian-deb
          path: "*.deb"

  publish-to-app-branch:
    name: Publish artifacts to app branch
    runs-on: ubuntu-latest
    needs:
      - android-apk
      - ios-ipa
      - macos-app
      - windows-exe
      - debian-deb
    steps:
      - name: Checkout app branch
        uses: actions/checkout@v4
        with:
          ref: app  # Changed from apk to app

      - name: Prepare dist directory
        run: |
          mkdir -p dist/android dist/ios dist/macos dist/windows dist/debian

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist/android

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: dist/ios

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: dist/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: dist/windows

      - name: Download Debian artifacts
        uses: actions/download-artifact@v4
        with:
          name: debian-deb
          path: dist/debian

      - name: Create version marker
        run: |
          echo "commit=${GITHUB_SHA}" > dist/build_info.txt
          echo "run_id=${GITHUB_RUN_ID}" >> dist/build_info.txt
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> dist/build_info.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(release): publish artifacts from ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
            git push origin app