name: badgemagic
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'
  flutter: '3.47.1'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: 2.5.5
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  cupertino_icons: ^1.0.9
  provider: ^6.1.5
  universal_ble: ^2.1.1
  quick_usb: ^0.4.0
  permission_handler: ^12.0.3
  logger: ^2.7.0
  flutter_svg: ^2.3.0
  get_it: ^9.2.1
  flutter_screenutil: ^5.9.3
  extended_text_field: ^17.0.0
  path_provider: ^2.1.6
  uuid: ^4.6.0
  go_router: ^17.5.0
  share_plus: ^13.3.0
  file_picker: ^12.0.0
  google_fonts: ^8.2.1
  url_launcher: ^6.3.2
  image: ^4.9.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.0
  flutter_lints: ^6.0.0
  dart_style: ^3.1.12
  flutter_launcher_icons: ^0.13.1

# Risolve il conflitto di versione ffi tra quick_usb e share_plus
dependency_overrides:
  ffi: ^2.1.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - lib/l10n/
    - assets/icons/
    - assets/animations/
    - assets/effects/
    - assets/vectors/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/icon.png"
  adaptive_icon_monochrome: "assets/icons/icon.png"
  adaptive_icon_foreground_inset: 22

  web:
    generate: true
    image_path: "assets/icons/icon.png"
    background_color: "#FFFFFF"
    theme_color: "#0175C2"

  windows:
    generate: true
    image_path: "assets/icons/icon.png"
    icon_size: 48

  macos:
    generate: true
    image_path: "assets/icons/icon.png"

  linux:
    generate: true
    image_path: "assets/icons/icon.png"